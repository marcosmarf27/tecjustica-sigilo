appId: com.tecjustica.sigilo
productName: TecJustiça Sigilo
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: resources/python-backend/
    to: python-backend/
    filter:
      - "**/*"
      - "!__pycache__/**"
      - "!*.pyc"
      - "!*.dist-info/**"
  # A CC BY 4.0 do modelo de NER exige atribuição em cada redistribuição, e o
  # NOTICE diz de si mesmo que cumpre essa obrigação "para a redistribuição do
  # aplicativo" — o que só é verdade se ele viajar junto. O `files:` acima não
  # o alcança: ele cobre `dist/` e `dist-electron/`, isto é, o que o Vite
  # compila, e o NOTICE não é código do renderer nem do main.
  - from: NOTICE
    to: NOTICE
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Põe `tecjustica-sigilo` no PATH do usuário na instalação e tira na
  # desinstalação. Antes isso só acontecia se a pessoa achasse a tela "Linha de
  # Comando" e clicasse no botão — quem instalava e ia usar o programa nunca
  # descobria que a CLI existia.
  include: build/installer.nsh
