appId: com.tecjustica.sigilo
productName: TecJustiça Sigilo
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: resources/python-backend/
    to: python-backend/
    filter:
      - "**/*"
      - "!__pycache__/**"
      - "!*.pyc"
      - "!*.dist-info/**"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Põe `tecjustica-sigilo` no PATH do usuário na instalação e tira na
  # desinstalação. Antes isso só acontecia se a pessoa achasse a tela "Linha de
  # Comando" e clicasse no botão — quem instalava e ia usar o programa nunca
  # descobria que a CLI existia.
  include: build/installer.nsh
